name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read
  security-events: write

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  DATABASE_URL: mongodb://localhost:27017/contraclaim
  SECRET_KEY: ci-secret-key-at-least-32-characters
  AWS_ACCESS_KEY_ID: ci-access-key-id
  AWS_SECRET_ACCESS_KEY: ci-secret-access-key
  AWS_BUCKET_NAME: ci-bucket
  AWS_REGION: ap-south-1
  OPENAI_API_KEY: ci-openai-key
  SMTP_USERNAME: ci@example.com
  SMTP_PASSWORD: ci-password
  SMTP_FROM_EMAIL: ci@example.com
  LANGGRAPH_API_TOKEN: ci-langgraph-token
  CONTRACT_QUEUE_ENABLED: "false"
  FALKORDB_ENABLED: "false"
  ALLOW_DEV_HEADERS: "false"
  RBAC_ENTITLEMENT_FAIL_OPEN: "false"

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend-checks:
    name: Backend lint and tests
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/rbac_backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit pytest pytest-asyncio
          pip install -r backend/rbac_backend/requirements.txt

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Compile backend modules
        run: python -m compileall -q backend/rbac_backend

      - name: Run backend test suite
        run: pytest backend/rbac_backend/tests -q

  frontend-checks:
    name: Frontend lint, tests, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Run frontend tests
        # vitest runs files serially (fileParallelism: false in vitest.config.ts
        # to avoid a parallel-run deadlock). That reuses one fork worker for the
        # whole suite, whose V8 heap accumulates across files, so give it headroom
        # to avoid an end-of-run OOM. Fork workers inherit NODE_OPTIONS.
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm test -- --run

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run frontend E2E tests
        run: npm run test:e2e

      - name: Build frontend
        run: npm run build

  dependency-scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Scan Python dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r backend/rbac_backend/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Scan frontend dependencies
        working-directory: client
        run: |
          npm ci
          npm audit --audit-level=high

  docker-build-and-scan:
    name: Docker build and image scan
    runs-on: ubuntu-latest
    needs: [backend-checks, frontend-checks]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t projectdms-backend:${{ github.sha }} ./backend

      - name: Build frontend image
        run: docker build -t projectdms-client:${{ github.sha }} ./client

      # These services are profile-gated in compose, but their Python runtime
      # must still be built on every change so a 3.12 incompatibility cannot
      # remain hidden until an operator enables the profile.
      - name: Build LangGraph image
        run: docker build -t projectdms-langgraph:${{ github.sha }} ./services/langgraph

      - name: Build Graphiti image
        run: docker build -t projectdms-graphiti:${{ github.sha }} ./services/graphiti

      - name: Build Docling image
        run: docker build -t projectdms-docling:${{ github.sha }} ./services/docling

      - name: Scan backend image
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: projectdms-backend:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: projectdms-client:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Scan LangGraph image
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: projectdms-langgraph:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Scan Graphiti image
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: projectdms-graphiti:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Scan Docling image
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: projectdms-docling:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
