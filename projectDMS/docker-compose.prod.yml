x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "5"

x-backend-env: &backend-env
  ENVIRONMENT: "production"
  ENABLE_API_DOCS: "false"
  ALLOW_DEV_HEADERS: "false"
  DATABASE_URL: "${DATABASE_URL:?DATABASE_URL must point to the production MongoDB replica set}"
  MONGODB_URI: "${DATABASE_URL:?DATABASE_URL must point to the production MongoDB replica set}"
  MONGODB_DATABASE: "${MONGODB_DATABASE:-contraclaim}"
  MONGODB_REPLICA_SET: "${MONGODB_REPLICA_SET:?MONGODB_REPLICA_SET is required in production}"
  MONGODB_RETRY_WRITES: "${MONGODB_RETRY_WRITES:-true}"
  MONGODB_ALLOW_STANDALONE_PRODUCTION: "false"
  SECRET_KEY: "${SECRET_KEY:?SECRET_KEY is required}"
  AUTH_COOKIE_NAME: "${AUTH_COOKIE_NAME:-cc_access_token}"
  AUTH_COOKIE_SECURE: "true"
  AUTH_COOKIE_SAMESITE: "${AUTH_COOKIE_SAMESITE:-lax}"
  AUTH_COOKIE_DOMAIN: "${AUTH_COOKIE_DOMAIN:-}"
  # C2: deny auth (503) while the session store is unreachable so revoked
  # sessions cannot outlive a Redis outage. false = availability tradeoff.
  AUTH_SESSION_FAIL_CLOSED: "${AUTH_SESSION_FAIL_CLOSED:-true}"
  CORS_ORIGINS: "${CORS_ORIGINS:?CORS_ORIGINS is required}"
  PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required}"
  PUBLIC_API_URL: "${PUBLIC_API_URL:-${PUBLIC_BASE_URL}/api}"
  APP_URL: "${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required}"
  OPENAI_API_KEY: "${OPENAI_API_KEY:?OPENAI_API_KEY is required}"
  AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID is required}"
  AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY is required}"
  AWS_REGION: "${AWS_REGION:-ap-south-1}"
  AWS_BUCKET_NAME: "${AWS_BUCKET_NAME:?AWS_BUCKET_NAME is required}"
  SMTP_HOST: "${SMTP_HOST:-smtp.gmail.com}"
  SMTP_PORT: "${SMTP_PORT:-587}"
  SMTP_USERNAME: "${SMTP_USERNAME:?SMTP_USERNAME is required}"
  SMTP_PASSWORD: "${SMTP_PASSWORD:?SMTP_PASSWORD is required}"
  SMTP_FROM_EMAIL: "${SMTP_FROM_EMAIL:?SMTP_FROM_EMAIL is required}"
  SMTP_SETTINGS_ENCRYPTION_KEY: "${SMTP_SETTINGS_ENCRYPTION_KEY:?SMTP_SETTINGS_ENCRYPTION_KEY is required}"
  PAYMENT_PROVIDER: "${PAYMENT_PROVIDER:-noop}"
  RAZORPAY_KEY_ID: "${RAZORPAY_KEY_ID:-}"
  RAZORPAY_KEY_SECRET: "${RAZORPAY_KEY_SECRET:-}"
  RAZORPAY_WEBHOOK_SECRET: "${RAZORPAY_WEBHOOK_SECRET:-}"
  APP_REDIS_URL: "redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/1"
  RUNTIME_STATE_REDIS_URL: "redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/1"
  CONTRACT_QUEUE_REDIS_URL: "redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0"
  FALKORDB_URL: "redis://:${FALKORDB_PASSWORD:?FALKORDB_PASSWORD is required}@falkordb:6379"
  FALKORDB_ENABLED: "${FALKORDB_ENABLED:-true}"
  FALKORDB_HOST: "falkordb"
  FALKORDB_PORT: "6379"
  FALKORDB_GRAPH_NAME: "contraclaim"
  FALKORDB_PASSWORD: "${FALKORDB_PASSWORD:?FALKORDB_PASSWORD is required}"
  GRAPH_PROVIDER: "direct_falkor"
  GRAPHITI_ENABLED: "false"
  QDRANT_URL: "http://qdrant:6333"
  QDRANT_API_KEY: "${QDRANT_API_KEY:?QDRANT_API_KEY is required}"
  QDRANT_COLLECTION: "${QDRANT_COLLECTION:-document_vectors}"
  QDRANT_VECTOR_SIZE: "${QDRANT_VECTOR_SIZE:-1536}"
  QDRANT_DISTANCE: "${QDRANT_DISTANCE:-cosine}"
  QDRANT_VECTOR_NAME: "${QDRANT_VECTOR_NAME:-}"
  VECTORDB_URL: "http://qdrant:6333"
  VECTORDB_API_KEY: "${QDRANT_API_KEY:?QDRANT_API_KEY is required}"
  LANGGRAPH_API_TOKEN: "${LANGGRAPH_API_TOKEN:?LANGGRAPH_API_TOKEN is required}"
  LANGGRAPH_ENABLED: "${LANGGRAPH_ENABLED:-false}"
  # The official in-process LangGraph drafting engine is selected entirely on
  # the server. Keep the safe v2/off defaults until an explicit rollout is
  # configured in the production environment.
  DRAFT_ENGINE_DEFAULT: "${DRAFT_ENGINE_DEFAULT:-v2}"
  DRAFT_ENGINE_ROLLOUT_MODE: "${DRAFT_ENGINE_ROLLOUT_MODE:-off}"
  DRAFT_ENGINE_CANARY_PERCENT: "${DRAFT_ENGINE_CANARY_PERCENT:-0}"
  DRAFT_ENGINE_CANARY_TENANT_IDS: "${DRAFT_ENGINE_CANARY_TENANT_IDS:-}"
  DRAFT_ENGINE_SHADOW_ENABLED: "${DRAFT_ENGINE_SHADOW_ENABLED:-false}"
  DRAFT_ENGINE_GRAPH_VERSION: "${DRAFT_ENGINE_GRAPH_VERSION:-v3}"
  DRAFT_ENGINE_STATE_SCHEMA_VERSION: "${DRAFT_ENGINE_STATE_SCHEMA_VERSION:-1}"
  DRAFT_ENGINE_PRODUCTION_ACCEPTED: "${DRAFT_ENGINE_PRODUCTION_ACCEPTED:-false}"
  DRAFT_ENGINE_MAX_CHECKPOINT_BYTES: "${DRAFT_ENGINE_MAX_CHECKPOINT_BYTES:-262144}"
  DRAFT_ENGINE_CHECKPOINT_RETENTION_DAYS: "${DRAFT_ENGINE_CHECKPOINT_RETENTION_DAYS:-30}"
  DRAFTING_QUEUE_ENABLED: "${DRAFTING_QUEUE_ENABLED:-false}"
  DRAFTING_QUEUE_REDIS_URL: "redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/1"
  DRAFTING_QUEUE_NAME: "${DRAFTING_QUEUE_NAME:-letter_drafting_queue}"
  DRAFTING_QUEUE_PROCESSING_NAME: "${DRAFTING_QUEUE_PROCESSING_NAME:-letter_drafting_processing}"
  DRAFTING_QUEUE_DEADLETTER_NAME: "${DRAFTING_QUEUE_DEADLETTER_NAME:-letter_drafting_deadletter}"
  DRAFTING_QUEUE_MAX_RETRIES: "${DRAFTING_QUEUE_MAX_RETRIES:-3}"
  DRAFTING_QUEUE_WORKERS: "${DRAFTING_QUEUE_WORKERS:-1}"
  DRAFTING_QUEUE_VISIBILITY_TIMEOUT_SECONDS: "${DRAFTING_QUEUE_VISIBILITY_TIMEOUT_SECONDS:-1800}"
  DRAFTING_QUEUE_HEARTBEAT_SECONDS: "${DRAFTING_QUEUE_HEARTBEAT_SECONDS:-30}"
  METRICS_ENABLED: "${METRICS_ENABLED:-true}"
  METRICS_TOKEN: "${METRICS_TOKEN:?METRICS_TOKEN is required when metrics are enabled}"
  LOG_LEVEL: "${LOG_LEVEL:-INFO}"
  SLOW_REQUEST_THRESHOLD_MS: "${SLOW_REQUEST_THRESHOLD_MS:-2000}"
  BACKUP_ROOT: "${BACKUP_ROOT:-/var/backups/contractdms}"
  BACKUP_MAX_AGE_HOURS: "${BACKUP_MAX_AGE_HOURS:-26}"
  BACKUP_REQUIRED_IN_PRODUCTION: "${BACKUP_REQUIRED_IN_PRODUCTION:-true}"
  BACKUP_REQUIRED_VOLUME_LABELS: "${BACKUP_REQUIRED_VOLUME_LABELS:-backend-uploads,qdrant-data,falkordb-data,redis-data}"
  BACKUP_S3_BUCKET: "${BACKUP_S3_BUCKET:?BACKUP_S3_BUCKET is required for production backups}"
  BACKUP_S3_PREFIX: "${BACKUP_S3_PREFIX:-contraclaim/backups}"
  UPLOADS_DIR: "/app/uploads"
  SECURE_UPLOADS_DIR: "/app/uploads"
  UPLOAD_STREAM_CHUNK_SIZE_MB: "${UPLOAD_STREAM_CHUNK_SIZE_MB:-1}"
  UPLOAD_VALIDATION_SAMPLE_BYTES: "${UPLOAD_VALIDATION_SAMPLE_BYTES:-8192}"
  GENERAL_UPLOAD_MAX_FILE_SIZE_MB: "${GENERAL_UPLOAD_MAX_FILE_SIZE_MB:-100}"
  UPLOAD_MAX_CONCURRENT_PER_USER: "${UPLOAD_MAX_CONCURRENT_PER_USER:-3}"
  UPLOAD_MAX_CONCURRENT_PER_ORG: "${UPLOAD_MAX_CONCURRENT_PER_ORG:-20}"
  ANTIVIRUS_ENABLED: "${ANTIVIRUS_ENABLED:-true}"
  ANTIVIRUS_REQUIRED_IN_PRODUCTION: "${ANTIVIRUS_REQUIRED_IN_PRODUCTION:-true}"
  CLAMAV_HOST: "${CLAMAV_HOST:-clamav}"
  CLAMAV_PORT: "${CLAMAV_PORT:-3310}"
  CLAMAV_TIMEOUT: "${CLAMAV_TIMEOUT:-30}"
  CLAMAV_FAIL_OPEN: "${CLAMAV_FAIL_OPEN:-false}"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *backend-env
      START_BACKGROUND_SERVICES: "true"
      START_CONTRACT_QUEUE_WORKERS: "false"
      # H2: the web tier must not run cron jobs (it may be scaled to >1 replica).
      # The contract-worker is the single scheduler owner; the leader lock is the
      # safety net if this is ever flipped on by mistake.
      RUN_SCHEDULER: "false"
    depends_on:
      qdrant:
        condition: service_healthy
      falkordb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - service-net
      - data-net
      - egress-net
    expose:
      - "8000"
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
      - ${BACKUP_ROOT:-/var/backups/contractdms}:${BACKUP_ROOT:-/var/backups/contractdms}:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging: *default-logging

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - edge-net
      - service-net
    expose:
      - "5173"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5173/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging

  contract-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "rbac_backend.worker"]
    environment:
      <<: *backend-env
      START_BACKGROUND_SERVICES: "false"
      START_CONTRACT_QUEUE_WORKERS: "true"
      START_DRAFTING_QUEUE_WORKERS: "${START_DRAFTING_QUEUE_WORKERS:-false}"
      # H2: single owner of the leader-locked cron jobs (keep this at 1 replica).
      RUN_SCHEDULER: "true"
    depends_on:
      qdrant:
        condition: service_healthy
      falkordb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - service-net
      - data-net
      - egress-net
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
      - ${BACKUP_ROOT:-/var/backups/contractdms}:${BACKUP_ROOT:-/var/backups/contractdms}:ro
    logging: *default-logging

  qdrant:
    image: qdrant/qdrant:v1.12.5
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: "${QDRANT_API_KEY:?QDRANT_API_KEY is required}"
      QDRANT__SERVICE__GRPC_PORT: "6334"
      QDRANT__LOG_LEVEL: "INFO"
      QDRANT__STORAGE__SNAPSHOT_PATH: "/qdrant/snapshots"
    volumes:
      - qdrant_data:/qdrant/storage
      - qdrant_snapshots:/qdrant/snapshots
    networks:
      - data-net
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'exec 3<>/dev/tcp/localhost/6333'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging

  falkordb:
    image: falkordb/falkordb:v4.0.8
    restart: unless-stopped
    environment:
      FALKORDB_PASSWORD: "${FALKORDB_PASSWORD:?FALKORDB_PASSWORD is required}"
      # The FalkorDB image entrypoint loads the graph module, then appends
      # REDIS_ARGS. Overriding `command` starts plain Redis without FalkorDB.
      REDIS_ARGS: >-
        --save 900 1
        --save 300 10
        --appendonly yes
        --requirepass ${FALKORDB_PASSWORD:?FALKORDB_PASSWORD is required}
        --maxmemory 2gb
        --maxmemory-policy volatile-lru
    volumes:
      - falkordb_data:/data
    networks:
      - data-net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -h localhost -a \"$${FALKORDB_PASSWORD}\" ping >/dev/null && redis-cli --no-auth-warning -h localhost -a \"$${FALKORDB_PASSWORD}\" COMMAND INFO GRAPH.QUERY | grep -qi graph.query"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      - sh
      - -c
      - redis-server --save 60 1 --appendonly yes --requirepass "$$REDIS_PASSWORD"
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
    volumes:
      - redis_data:/data
    networks:
      - service-net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -h localhost -a \"$${REDIS_PASSWORD}\" ping"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging

  graphiti:
    profiles: ["graph-experimental"]
    build:
      context: ./services/graphiti
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      GRAPHITI_DB_URL: "redis://:${FALKORDB_PASSWORD:?FALKORDB_PASSWORD is required}@falkordb:6379"
      GRAPHITI_QDRANT_URL: "http://qdrant:6333"
      GRAPHITI_QDRANT_API_KEY: "${QDRANT_API_KEY:?QDRANT_API_KEY is required}"
      GRAPHITI_OPENAI_API_KEY: "${OPENAI_API_KEY:?OPENAI_API_KEY is required}"
      GRAPHITI_LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      GRAPHITI_GRAPH_NAME: "contraclaim"
    depends_on:
      qdrant:
        condition: service_healthy
      falkordb:
        condition: service_healthy
    networks:
      - service-net
      - data-net
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging: *default-logging

  clamav:
    # Pinned like every other image: AV is fail-closed in production, so an
    # unexpected upstream release must not be able to break uploads on redeploy.
    image: clamav/clamav:1.4
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2g
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping=1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - service-net
    logging: *default-logging

  gateway:
    image: httpd:2.4
    restart: unless-stopped
    depends_on:
      client:
        condition: service_healthy
      backend:
        condition: service_healthy
    # C1: the bundled gateway speaks plain HTTP only, while the backend enforces
    # AUTH_COOKIE_SECURE=true in production — so this port must never be the
    # public entry point. Default to loopback; a host reverse proxy (see
    # config/nginx-contraclaim.conf) terminates TLS on 443 and proxies here.
    # Only set HTTP_PORT=80 explicitly when an external load balancer already
    # terminates TLS in front of this host.
    ports:
      - "${HTTP_PORT:-127.0.0.1:8080}:80"
    volumes:
      - ./config/httpd.conf:/usr/local/apache2/conf/httpd.conf:ro
      - ./config/health.txt:/usr/local/apache2/htdocs/health.txt:ro
    networks:
      - edge-net
      - service-net
    healthcheck:
      # Real HTTP probe over /dev/tcp (the httpd image ships no curl/wget):
      # proves Apache is serving /health with a 200, not merely that the
      # health file exists on disk.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/80 && printf \"GET /health HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q \" 200 \" <&3'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging

volumes:
  backend_uploads:
  backend_logs:
  qdrant_data:
  qdrant_snapshots:
  falkordb_data:
  redis_data:

networks:
  data-net:
    driver: bridge
    internal: true
  service-net:
    driver: bridge
    internal: true
  edge-net:
    driver: bridge
  egress-net:
    driver: bridge
