x-mongo-healthcheck: &mongo-healthcheck
  test: ["CMD-SHELL", "mongosh --quiet --eval \"const s=rs.status(); quit((s.ok === 1 && (s.myState === 1 || s.myState === 2)) ? 0 : 1)\""]
  interval: 30s
  timeout: 5s
  retries: 10
  start_period: 30s

x-mongo-ulimits: &mongo-ulimits
  nofile:
    soft: 64000
    hard: 64000

services:
  mongo1:
    image: mongo:8.0
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo1_data:/data/db
    networks:
      - data-net
    ulimits: *mongo-ulimits
    healthcheck: *mongo-healthcheck
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  mongo2:
    image: mongo:8.0
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo2_data:/data/db
    networks:
      - data-net
    ulimits: *mongo-ulimits
    healthcheck: *mongo-healthcheck
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  mongo3:
    image: mongo:8.0
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo3_data:/data/db
    networks:
      - data-net
    ulimits: *mongo-ulimits
    healthcheck: *mongo-healthcheck
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  mongo-init:
    image: mongo:8.0
    restart: "no"
    depends_on:
      mongo1:
        condition: service_started
      mongo2:
        condition: service_started
      mongo3:
        condition: service_started
    volumes:
      - ./scripts/mongo/init-replica-set.sh:/scripts/init-replica-set.sh:ro
    networks:
      - data-net
    entrypoint: ["/bin/bash", "/scripts/init-replica-set.sh"]

volumes:
  mongo1_data:
  mongo2_data:
  mongo3_data:

networks:
  data-net:
    driver: bridge
